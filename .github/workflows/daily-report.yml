name: public-market-brief

on:
  schedule:
    # Weekday 19:35 CST; Saturday 17:35 CST for weekly recap.
    - cron: '35 11 * * 1-5'
    - cron: '35 9 * * 6'
  workflow_dispatch:
    inputs:
      publish_weekly:
        type: boolean
        description: Publish a weekly edition now
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: public-market-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q .
      - name: Offline verification
        run: python -m unittest -q test_public.py
      - name: Validate delivery and monitoring before cutover
        env:
          ADVISOR_DELIVERY_JSON: ${{ secrets.ADVISOR_CONFIG }}
          PUBLIC_HEARTBEAT_URL: ${{ secrets.PUBLIC_HEARTBEAT_URL }}
        run: |
          python public_runner.py recipients
          if [ -z "$PUBLIC_HEARTBEAT_URL" ]; then
            echo 'PUBLIC_HEARTBEAT_URL is required before unattended launch' >&2
            exit 1
          fi
      - name: Build public research
        env:
          FORCE_WEEKLY: ${{ inputs.publish_weekly }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "$FORCE_WEEKLY" = 'true' ]; then
            python public_runner.py prepare --weekly
          else
            python public_runner.py prepare
          fi
      - name: Commit public research state
        run: |
          git config user.name "market-advisor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public_data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "public: update research state"
            git push origin HEAD:master
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site
      - name: Deploy public pages
        id: pages
        uses: actions/deploy-pages@v4
      - name: Verify public Pages content before notifications
        run: python public_runner.py verify-live
      - name: Record verified Pages deployment
        env:
          PAGES_DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python public_runner.py deployed --deployment-id "$PAGES_DEPLOYMENT_ID"
          git add public_data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "public: record deployment"
            git push origin HEAD:master
          fi
      - name: Send subscribed notifications
        env:
          ADVISOR_DELIVERY_JSON: ${{ secrets.ADVISOR_CONFIG }}
        run: |
          set -euo pipefail
          aliases="$(python public_runner.py recipients)"
          while IFS= read -r alias; do
            if [ -z "$alias" ]; then
              continue
            fi
            events="$(python public_runner.py events --recipient "$alias")"
            while IFS= read -r event; do
              if [ -z "$event" ]; then
                continue
              fi
              attempt="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${alias}-${event}"
              python public_runner.py reserve --recipient "$alias" --attempt "$attempt" --event "$event"
              python public_runner.py notify --recipient "$alias" --attempt "$attempt" --event "$event"
            done <<< "$events"
          done <<< "$aliases"
      - name: Notify operator on failure
        if: failure()
        env:
          SC_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -n "$SC_KEY" ]; then
            curl --fail --silent --show-error --max-time 15 -X POST "https://sctapi.ftqq.com/${SC_KEY}.send" \
              --data-urlencode "title=公共市场简报运行失败" \
              --data-urlencode "desp=GitHub Actions 运行失败，请检查工作流日志。" > /dev/null
          fi
