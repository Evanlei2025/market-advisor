name: daily-report

on:
  schedule:
    # 北京时间 15:35 = UTC 07:35，周一至周五
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dependency consistency check
        run: |
          python -m pip check
          python -c "import akshare, pandas, requests; print('akshare', akshare.__version__, '| pandas', pandas.__version__)"

      - name: Run daily report
        env:
          ADVISOR_CONFIG_JSON: ${{ secrets.ADVISOR_CONFIG }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TQDM_DISABLE: '1'
        run: python main.py

      - name: Commit back (knowledge base traces)
        run: |
          git config user.name "market-advisor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add knowledge_base/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "kb: update $(date +%Y-%m-%d)"
            git push
          fi

      - name: Upload report archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-archive
          path: reports
          retention-days: 90

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify on failure
        if: failure()
        env:
          SC_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -n "$SC_KEY" ]; then
            curl -s -X POST "https://sctapi.ftqq.com/${SC_KEY}.send" \
              -d "title=投顾日报运行失败" \
              -d "desp=GitHub Actions 运行失败，请查看仓库 Actions 日志。" > /dev/null
          fi
