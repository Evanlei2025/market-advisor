name: public-market-brief

on:
  schedule:
    # Weekday 19:35 CST; Saturday 17:35 CST for weekly recap.
    - cron: '35 11 * * 1-5'
    - cron: '35 9 * * 6'
  workflow_dispatch:
    inputs:
      publish_weekly:
        type: boolean
        description: Publish a weekly edition now
        default: false
      logical_date:
        type: string
        description: Explicit logical date YYYY-MM-DD (historical recovery)
        default: ''
      backfill:
        type: boolean
        description: Recover historical snapshot/observation only; suppress new alerts
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: public-market-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      PUBLIC_CONTEXT_FILE: /tmp/public-run-context-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: master
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Resolve logical task date and record scheduler delay
        id: context
        env:
          PUBLIC_SCHEDULE: ${{ github.event.schedule }}
          PUBLIC_RUN_KIND: ${{ inputs.publish_weekly && 'weekly' || 'daily' }}
          PUBLIC_LOGICAL_DATE: ${{ inputs.logical_date }}
          PUBLIC_BACKFILL: ${{ inputs.backfill }}
        run: python public_schedule.py --output "$PUBLIC_CONTEXT_FILE"
      - name: Notify operator of scheduler delay
        id: delay
        env:
          SC_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python public_ops.py --delay
      - run: pip install -r requirements.txt
        id: install
      - run: python -m pip check
        id: dependencies
      - run: python -m compileall -q .
        id: syntax
      - name: Offline verification
        id: tests
        run: python -m unittest -q test_public.py
      - name: Validate delivery and monitoring before cutover
        id: config
        env:
          ADVISOR_DELIVERY_JSON: ${{ secrets.ADVISOR_CONFIG }}
          PUBLIC_HEARTBEAT_URL: ${{ secrets.PUBLIC_HEARTBEAT_URL }}
        run: |
          python public_runner.py recipients
          if [ -z "$PUBLIC_HEARTBEAT_URL" ]; then
            echo 'PUBLIC_HEARTBEAT_URL is required before unattended launch' >&2
            exit 1
          fi
      - name: Build public research
        id: prepare
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python public_runner.py prepare --context "$PUBLIC_CONTEXT_FILE"
      - name: Commit public research state
        id: state
        run: |
          git config user.name "market-advisor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public_data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "public: update research state"
            git push origin HEAD:master
          fi
      - uses: actions/configure-pages@v5
        id: pages_config
      - uses: actions/upload-pages-artifact@v3
        id: artifact
        with:
          path: public_site
      - name: Deploy public pages
        id: pages
        uses: actions/deploy-pages@v4
      - name: Verify public Pages content before notifications
        id: verify
        run: python public_runner.py verify-live
      - name: Record verified Pages deployment
        id: deployed
        env:
          PAGES_DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python public_runner.py deployed --deployment-id "$PAGES_DEPLOYMENT_ID"
          git add public_data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "public: record deployment"
            git push origin HEAD:master
          fi
      - name: Send subscribed notifications
        id: notify
        if: ${{ !inputs.backfill }}
        env:
          ADVISOR_DELIVERY_JSON: ${{ secrets.ADVISOR_CONFIG }}
        run: |
          set -euo pipefail
          aliases="$(python public_runner.py recipients)"
          while IFS= read -r alias; do
            if [ -z "$alias" ]; then
              continue
            fi
            events="$(python public_runner.py events --recipient "$alias")"
            while IFS= read -r event; do
              if [ -z "$event" ]; then
                continue
              fi
              attempt="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${alias}-${event}"
              python public_runner.py reserve --recipient "$alias" --attempt "$attempt" --event "$event"
              python public_runner.py notify --recipient "$alias" --attempt "$attempt" --event "$event"
            done <<< "$events"
          done <<< "$aliases"
      - name: Notify operator on failure
        if: failure()
        env:
          SC_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUBLIC_STEPS_JSON: ${{ toJson(steps) }}
        run: python public_ops.py
