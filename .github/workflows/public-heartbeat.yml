name: public-service-heartbeat
run-name: public-service-heartbeat ${{ inputs.logical_date || 'scheduled' }} ${{ inputs.trigger_id || github.run_id }}

on:
  schedule:
    # Every day 22:17 China time, after the daily publication window.
    - cron: '17 14 * * *'
  workflow_dispatch:
    inputs:
      logical_date:
        type: string
        description: Optional logical market cutoff date YYYY-MM-DD
        default: ''
      scheduled_for:
        type: string
        description: Original scheduled slot in ISO-8601 with timezone
        default: ''
      trigger_id:
        type: string
        description: External scheduler correlation id
        default: ''

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_CONTEXT_FILE: /tmp/public-run-context-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: master
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Resolve logical heartbeat date and record scheduler delay
        id: context
        env:
          PUBLIC_SCHEDULE: ${{ github.event.schedule }}
          PUBLIC_LOGICAL_DATE: ${{ inputs.logical_date }}
          PUBLIC_SCHEDULED_FOR: ${{ inputs.scheduled_for }}
          PUBLIC_TRIGGER_ID: ${{ inputs.trigger_id }}
        run: python public_schedule.py --heartbeat --output "$PUBLIC_CONTEXT_FILE"
      - name: Notify operator of scheduler delay
        id: delay
        env:
          SC_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python public_ops.py --delay
      - run: pip install -r requirements.txt
        id: install
      - name: Verify report state and notify external monitor
        id: verify
        env:
          PUBLIC_HEARTBEAT_URL: ${{ secrets.PUBLIC_HEARTBEAT_URL }}
        run: python public_health.py --context "$PUBLIC_CONTEXT_FILE"
      - name: Notify operator on failure
        if: failure()
        env:
          SC_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUBLIC_STEPS_JSON: ${{ toJson(steps) }}
        run: python public_ops.py
