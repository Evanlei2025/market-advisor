name: public-research-ci

on:
  push:
    branches: [master]
    paths:
      - 'public_*.py'
      - 'test_public.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -q test_public.py test_clients.py
